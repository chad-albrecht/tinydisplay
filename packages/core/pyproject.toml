[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinydisplay-core"
version = "0.1.0"
description = "Hardware-agnostic rendering engine for TinyDisplay: canvases, widgets and display drivers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["display", "rendering", "embedded", "home-assistant", "dashboard"]
authors = [{ name = "The TinyDisplay authors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Embedded Systems",
    "Typing :: Typed",
]
dependencies = [
    # Framebuffer storage and vectorised compositing.
    "numpy>=1.26",
    # Glyph rasterisation, image decoding and PNG export.
    # 10.1 is the first release whose ImageFont.load_default() accepts a size.
    "pillow>=10.1",
]

[project.urls]
Homepage = "https://github.com/chad-albrecht/tinydisplay"
Source = "https://github.com/chad-albrecht/tinydisplay"
Issues = "https://github.com/chad-albrecht/tinydisplay/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tinydisplay"]
