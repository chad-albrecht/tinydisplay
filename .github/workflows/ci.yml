name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          # uv.lock is deliberately not committed (this is a library workspace,
          # so downstream resolution should stay free). Key the cache off the
          # pyproject files instead, or it would never invalidate.
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install the workspace
        run: uv sync --python 3.12

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check --diff .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          # uv.lock is deliberately not committed (this is a library workspace,
          # so downstream resolution should stay free). Key the cache off the
          # pyproject files instead, or it would never invalidate.
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install the workspace
        run: uv sync --python 3.12

      - name: mypy
        run: uv run mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          # uv.lock is deliberately not committed (this is a library workspace,
          # so downstream resolution should stay free). Key the cache off the
          # pyproject files instead, or it would never invalidate.
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install the workspace
        run: uv sync --python ${{ matrix.python-version }}

      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          # uv.lock is deliberately not committed (this is a library workspace,
          # so downstream resolution should stay free). Key the cache off the
          # pyproject files instead, or it would never invalidate.
          cache-dependency-glob: "**/pyproject.toml"

      - name: Build tinydisplay-core
        run: uv build --package tinydisplay-core --out-dir dist

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
