[tool.uv.workspace]
members = ["packages/*"]
exclude = [
    # Not yet implemented -- these directories hold planning stubs only.
    "packages/homeassistant",
    "packages/widgets",
]

[tool.uv.sources]
tinydisplay-core = { workspace = true }
tinydisplay-ht32 = { workspace = true }
tinydisplay-simulator = { workspace = true }

[dependency-groups]
dev = [
    "tinydisplay-core",
    "tinydisplay-ht32",
    "tinydisplay-simulator",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/core/src", "packages/ht32/src", "packages/simulator/src", "tests"]

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "ANN",    # flake8-annotations
    "ARG",    # flake8-unused-arguments
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "E",      # pycodestyle errors
    "EM",     # flake8-errmsg
    "F",      # pyflakes
    "FA",     # flake8-future-annotations
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "N",      # pep8-naming
    "PERF",   # perflint
    "PIE",    # flake8-pie
    "PL",     # pylint
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # ruff-specific
    "SIM",    # flake8-simplify
    "SLF",    # flake8-self
    "T20",    # flake8-print
    "TCH",    # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = [
    "ANN401",   # Dynamically typed expressions (Any) are sometimes required.
    "PLR0913",  # Drawing primitives legitimately take many arguments.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004",  # Magic values are the point of assertions.
    "SLF001",   # Tests may reach into private state.
]
"examples/**" = ["T20"]  # Examples print to stdout on purpose.

# Tk is imported inside the functions that need it, never at module scope, so
# that importing the simulator -- or collecting its tests -- works on a machine
# with no GUI toolkit installed. See tinydisplay.simulator.window.
"packages/simulator/src/tinydisplay/simulator/window.py" = ["PLC0415"]
"tests/simulator/test_window.py" = ["PLC0415"]
"tests/simulator/test_cli.py" = ["PLC0415"]

# Same reasoning for the HT32 transports: hidapi and pyserial are optional
# extras carrying compiled code and USB permissions, so they are imported
# inside the functions that need them. Importing tinydisplay.ht32 -- and
# testing everything above the transport -- works without either installed.
"packages/ht32/src/tinydisplay/ht32/device.py" = ["PLC0415"]
"packages/ht32/src/tinydisplay/ht32/led.py" = ["PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["tinydisplay"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages/core/src:packages/ht32/src:packages/simulator/src"
files = ["packages", "tests", "examples"]
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true

# hidapi and pyserial are optional extras of tinydisplay-ht32, imported inside
# the functions that need them. Neither ships type information, and neither is
# installed in the default development environment.
[[tool.mypy.overrides]]
module = ["hid.*", "serial.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "packages/core/src", "packages/ht32/src", "packages/simulator/src"]
pythonpath = ["packages/core/src", "packages/ht32/src", "packages/simulator/src"]
asyncio_mode = "auto"
markers = [
    # Integration tests that need an HT32 panel physically attached. Deselected
    # in CI with `-m "not hardware"`; the conftest also skips them when no
    # panel is found, so running the suite locally with nothing plugged in
    # reports skips rather than failures.
    "hardware: requires an HT32 panel attached over USB",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--doctest-modules",
    # Each package gets its own tests/<package>/ directory, so basenames
    # collide by design (tests/core/test_driver.py and
    # tests/simulator/test_driver.py both exist). importlib mode imports test
    # modules by location rather than by basename, which the default prepend
    # mode cannot do without scattering __init__.py files through tests/.
    "--import-mode=importlib",
    "-ra",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["tinydisplay"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "@(typing\\.)?overload",
]
