# Five screens on rotation: outdoors, indoors, the front door, the machine, and
# the internet connection. Laid out for the HT32's 320x170.
#
# Preview it with no Home Assistant and no hardware, after pointing that
# example's DASHBOARD_PATH at this file:
#
#     uv run python -m tinydisplay.simulator examples/ha_simulator_dashboard.py
#
# **The entity ids here are placeholders.** Each is named in a comment above
# the screen that uses it, so substituting yours is a search for the id rather
# than a read of the whole document. Check them in Developer Tools -> States
# first: an entity that does not exist does not raise, it draws as `--` or as
# an empty bar, which looks exactly like a reading of zero.

theme: midnight
background: background
unavailable: "--"

rotate_every: 10

screens:
  # -- 1. Outdoors -------------------------------------------------------
  # weather.forecast_home -- state is the condition; temperature and humidity
  # are attributes of it, so the whole screen reads one entity.
  - name: Outdoors
    root:
      type: stack
      axis: vertical
      spacing: 4
      padding: 8
      children:
        - type: stack
          axis: horizontal
          size: 16
          spacing: 6
          children:
            - type: label
              weight: 1
              text: Outdoors
              color: muted
              valign: middle
              wrap: false

            - type: label
              weight: 2
              text: "{{ weather.forecast_home | replace('_', ' ') | title }}"
              color: text
              align: right
              valign: middle
              wrap: false
              shrink_to_fit: true

        # Two columns, and the second one is a rail: the temperature starts at
        # the same x as the humidity bar below it, because both left columns
        # are 116 wide with the same 4px of spacing after them. Lining those up
        # is most of what makes the screen look composed rather than assembled.
        #
        # The icon centres itself in that 116, rather than sitting flush with
        # the left margin. Nesting it in its own stack with a trailing spacer
        # would square that off, and an earlier version of this file did -- but
        # it put the icon's state map four levels deep, and a temperature label
        # that lands inside that column instead of beside it gets no width and
        # draws nothing. Sixteen pixels is not worth a shape that fails silently
        # when it is copied by hand.
        - type: stack
          axis: horizontal
          weight: 1
          spacing: 4
          children:
            # A weather entity's state *is* its condition, so one state-mapped
            # icon covers the whole forecast. All fifteen of Home Assistant's
            # conditions are listed; `default` still earns its place, because
            # a weather entity reports `unavailable` while it starts up and
            # `unknown` if its backend fails, and neither is a condition.
            - type: icon
              size: 116
              cross_align: center
              cross_size: 84
              thickness: 4
              entity: weather.forecast_home
              icon:
                sunny: sun
                clear-night: moon
                partlycloudy: cloud-sun
                cloudy: cloud
                fog: fog
                rainy: cloud-rain
                pouring: cloud-rain
                snowy: cloud-snow
                snowy-rainy: cloud-snow
                hail: cloud-snow
                lightning: cloud-lightning
                lightning-rainy: cloud-lightning
                windy: wind
                windy-variant: wind
                exceptional: warning
                default: cloud
              color:
                sunny: warning
                clear-night: muted
                lightning: warning
                lightning-rainy: warning
                exceptional: danger
                default: text

            # Left-aligned, not centred: centring it in the remaining width
            # left a void beside the icon, and moved the whole number sideways
            # whenever the reading gained or lost a digit.
            - type: label
              weight: 1
              text: "{{ weather.forecast_home.temperature | round(0) }}°"
              color: accent
              font_size: 60
              align: left
              valign: middle
              wrap: false
              shrink_to_fit: true

        - type: stack
          axis: horizontal
          size: 30
          spacing: 4
          children:
            # 116 to match the icon's column, and because "Humidity 100%" is
            # 109px: the old 96 was under that, so `shrink_to_fit` was quietly
            # rendering this line smaller than the one on every other screen.
            - type: label
              size: 116
              text: "Humidity {{ weather.forecast_home.humidity | round(0) }}%"
              color: muted
              valign: middle
              wrap: false
              shrink_to_fit: true

            - type: progress
              weight: 1
              cross_size: 12
              cross_align: center
              entity: weather.forecast_home
              attribute: humidity
              max: 100
              color: accent
              track_color: surface
              radius: 3

  # -- 2. Indoors --------------------------------------------------------
  # sensor.h5075_living_room_temperature
  # sensor.h5075_living_room_humidity
  - name: Indoors
    root:
      type: stack
      axis: vertical
      spacing: 4
      padding: 8
      children:
        - type: stack
          axis: horizontal
          size: 16
          spacing: 6
          children:
            - type: label
              weight: 1
              text: Living Room
              color: muted
              valign: middle
              wrap: false

            - type: label
              weight: 1
              text: "{{ sensor.h5075_living_room_humidity | round(0) }}% RH"
              color: text
              align: right
              valign: middle
              wrap: false

        - type: label
          weight: 1
          text: "{{ sensor.h5075_living_room_temperature | round(1) }}{{ sensor.h5075_living_room_temperature.unit_of_measurement }}"
          color: accent
          font_size: 56
          align: center
          valign: middle
          wrap: false
          shrink_to_fit: true

        # Humidity since the panel started. The sparkline samples on change,
        # so this is a record of what happened, not of when it was repainted.
        - type: sparkline
          size: 34
          entity: sensor.h5075_living_room_humidity
          color: accent

  # -- 3. Front door -----------------------------------------------------
  # lock.front_door -- state is `locked` or `unlocked`. For a contact sensor
  # instead, use binary_sensor.front_door and map `on`/`off` rather than
  # `locked`/`unlocked` in both colour blocks below.
  - name: Front door
    root:
      type: stack
      axis: vertical
      spacing: 6
      padding: 10
      children:
        - type: label
          size: 16
          text: Front Door
          color: muted
          align: center
          valign: middle
          wrap: false

        - type: stack
          axis: horizontal
          weight: 1
          spacing: 12
          children:
            - type: icon
              size: 56
              cross_align: center
              cross_size: 56
              # The symbol follows the lock, not just its colour: shut shackle
              # when locked, open when not. `default` is required on a
              # state-mapped icon, and catches the states a lock really does
              # report -- `jammed`, `opening` -- without them being listed.
              icon:
                locked: lock
                unlocked: unlock
                default: warning
              thickness: 5
              entity: lock.front_door
              color:
                locked: success
                unlocked: danger
                default: muted

            - type: label
              weight: 1
              text: "{{ lock.front_door | title }}"
              font_size: 46
              align: center
              valign: middle
              wrap: false
              shrink_to_fit: true
              entity: lock.front_door
              color:
                locked: success
                unlocked: danger
                default: muted

  # -- 4. System ---------------------------------------------------------
  # sensor.processor_use          sensor.processor_temperature
  # sensor.memory_use_percent     sensor.last_boot
  - name: System
    root:
      type: stack
      axis: vertical
      spacing: 5
      padding: 8
      children:
        - type: stack
          axis: horizontal
          size: 16
          spacing: 6
          children:
            - type: label
              weight: 1
              text: System
              color: muted
              valign: middle
              wrap: false

            - type: label
              weight: 1
              text: "{{ sensor.processor_temperature | round(0) }}°C"
              color: text
              align: right
              valign: middle
              wrap: false

        # CPU temperature as a bargraph. `zones` colours each segment by where
        # it sits in the range rather than recolouring the whole bar, so the
        # green end stays green while the tip goes red -- headroom and level in
        # one glance. Boundaries are in degrees, the same units as min/max.
        #
        # `thickness` keeps it a thin band: the gauge still owns a 12px slot,
        # but draws 6px centred in it, so the row breathes.
        - type: gauge
          size: 12
          thickness: 6
          entity: sensor.processor_temperature
          min: 30
          max: 90
          segments: 24
          gap: 1
          track_color: surface
          zones:
            - to: 65
              color: success
            - to: 78
              color: warning
            - color: danger

        - type: grid
          weight: 1
          rows: 2
          columns: 1
          spacing: 6
          children:
            - type: stack
              row: 0
              column: 0
              axis: vertical
              spacing: 3
              children:
                - type: label
                  size: 13
                  text: "CPU {{ sensor.processor_use | round(0) }}%"
                  color: muted
                  wrap: false

                - type: gauge
                  weight: 1
                  entity: sensor.processor_use
                  max: 100
                  segments: 16
                  color: success
                  track_color: surface
                  warning_at: 0.8
                  warning_color: warning

            - type: stack
              row: 1
              column: 0
              axis: vertical
              spacing: 3
              children:
                - type: label
                  size: 13
                  text: "Memory {{ sensor.memory_use_percent | round(0) }}%"
                  color: muted
                  wrap: false

                - type: progress
                  weight: 1
                  entity: sensor.memory_use_percent
                  max: 100
                  color: accent
                  track_color: surface
                  radius: 3

        # `age` turns the timestamp into how long ago it was. It is the one
        # filter that reads the clock, so this line changes without any entity
        # changing -- which means it is as fresh as `max_interval`, not as
        # fresh as the clock.
        - type: label
          size: 14
          text: "Up {{ sensor.last_boot | age | default(--) }}"
          color: muted
          align: center
          valign: middle
          wrap: false
          shrink_to_fit: true

  # -- 5. Speedtest ------------------------------------------------------
  # sensor.speedtest_download  sensor.speedtest_upload  sensor.speedtest_ping
  - name: Speedtest
    root:
      type: stack
      axis: vertical
      spacing: 4
      padding: 8
      children:
        - type: stack
          axis: horizontal
          size: 16
          spacing: 6
          children:
            - type: label
              weight: 1
              text: Internet
              color: muted
              valign: middle
              wrap: false

            - type: label
              weight: 1
              text: "{{ sensor.speedtest_ping | round(0) }} ms"
              color: text
              align: right
              valign: middle
              wrap: false

        - type: grid
          weight: 1
          rows: 1
          columns: 2
          spacing: 10
          children:
            - type: stack
              row: 0
              column: 0
              axis: vertical
              spacing: 2
              children:
                - type: stack
                  axis: horizontal
                  size: 14
                  spacing: 4
                  children:
                    - type: icon
                      size: 12
                      cross_align: center
                      cross_size: 12
                      icon: arrow-down
                      thickness: 2
                      color: success

                    - type: label
                      weight: 1
                      text: Down
                      color: muted
                      valign: middle
                      wrap: false

                - type: label
                  weight: 1
                  text: "{{ sensor.speedtest_download | round(0) }}"
                  color: success
                  font_size: 40
                  align: center
                  valign: middle
                  wrap: false
                  shrink_to_fit: true

            - type: stack
              row: 0
              column: 1
              axis: vertical
              spacing: 2
              children:
                - type: stack
                  axis: horizontal
                  size: 14
                  spacing: 4
                  children:
                    - type: icon
                      size: 12
                      cross_align: center
                      cross_size: 12
                      icon: arrow-up
                      thickness: 2
                      color: accent

                    - type: label
                      weight: 1
                      text: Up
                      color: muted
                      valign: middle
                      wrap: false

                - type: label
                  weight: 1
                  text: "{{ sensor.speedtest_upload | round(0) }}"
                  color: accent
                  font_size: 40
                  align: center
                  valign: middle
                  wrap: false
                  shrink_to_fit: true

        - type: label
          size: 13
          text: Mbit/s
          color: muted
          align: center
          valign: middle
          wrap: false
