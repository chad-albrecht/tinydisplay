default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # mypy needs the real dependencies to check numpy/PIL call sites, and
        # PyYAML's stubs to check the dashboard parser. Home Assistant is
        # deliberately absent: the custom component is checked with its symbols
        # treated as untyped, which is what the overrides in pyproject.toml do.
        additional_dependencies:
          - numpy>=1.26
          - pillow>=10.1
          - pytest>=8.3
          - pyyaml>=6.0
          - types-PyYAML>=6.0
        args: [--config-file=pyproject.toml]
        pass_filenames: false
